kind = "mobile"
previewPath = "/"
title = "Lumia 2026"
version = "1.0.0"
id = "artifacts/lumia"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 21522

[services.development]
run = "pnpm --filter @workspace/lumia run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lumia", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/lumia", "run", "serve" ]

[services.env]
PORT = "21522"
BASE_PATH = "/"
